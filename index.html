<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Full Screen Image Click-through</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 10pt;
      background-color: #ffffff;
      color: #000000;
      cursor: default;
    }

    /* FIXED WHITE TOP BANNER */
    .top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      z-index: 10;
      box-sizing: border-box;
    }

    /* INNER BANNER: 2 COLUMNS */
    .top-banner-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 1rem;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    /* TEXT COLUMNS */
    .text-column {
      max-width: 33vw;
      text-align: left;
      line-height: 0.8;
    }
    .text-column p {
      margin: 0 0 0.4rem 0;
    }
    .text-column a {
      color: inherit;
      text-decoration: underline;
    }

    .name-role {
      font-weight: 500;
    }

    /* FULL-BLEED IMAGE BELOW BANNER */
    .image-area {
      position: fixed;
      left: 0;
      right: 0;
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      z-index: 0;
      cursor: pointer;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .top-banner-inner {
        grid-template-columns: 1fr;
        row-gap: 1rem;
        padding: 1.25rem;
      }

      .text-column {
        max-width: 100%;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- TOP BANNER -->
  <div class="top-banner" id="topBanner">
    <div class="top-banner-inner">

      <!-- COLUMN 1 — FIXED TEXT -->
      <div class="text-column">
        <p class="name-role">Camille Yvert | Design + Art Direction</p>
        <p class="download-links">
          <a href="cv.pdf" target="_blank">CV</a> |
          <a href="portfolio.pdf" target="_blank">Portfolio</a> |
          <a href="mailto:camille.yvert@gmail.com">Contact</a>
        </p>
      </div>

      <!-- COLUMN 2 — CAPTION -->
      <div class="text-column" id="column2">
        <p>Loading…</p>
      </div>

    </div>
  </div>

  <!-- FULL BLEED IMAGE AREA -->
  <div class="image-area" id="imageArea"></div>

  <script>
    /* IMAGE LIST */
    let images = [
      "images/photo1.jpg",
      "images/photo2.jpg",
      "images/photo3.jpg",
      "images/photo4.jpg",
      "images/photo5.jpg",
      "images/photo6.jpg",
      "images/photo7.jpg",
      "images/photo8.jpg",
      "images/photo9.jpg",
      "images/photo10.jpg",
      "images/photo11.jpg",
      "images/photo12.jpg",
      "images/photo13.jpg",
      "images/photo14.jpg",
      "images/photo15.jpg",
      "images/photo16.jpg",
      "images/photo17.jpg"
    ];

    /* CAPTIONS — Add more to match your image list */
    let imageCaptions = [
      `<p>The Nue co. | Head of design</p><p>Packaging Rebrand</p>`,
      `<p>The Nue co. | Head of design</p><p>Brand Guidelines and Identity</p>`,
      `<p>The Nue co. | Head of design</p><p>Offsite Digital</p>`,
      `<p>Beauty Seen Group | Lead Designer</p><p>Dove Hair Brand Book</p>`,
      `<p>The Nue co. | Head of design</p><p>Offsite Digital</p>`,
      `<p>Farfetch | Senior Designer</p><p>Print and Digital Assets</p>`,
      `<p>Farfetch | Assistant art director</p><p>Assisting AD with shoot production</p>`,
      `<p>The Nue co. | Head of design</p><p>Product Launch Kit</p>`,
      `<p>The Nue co. | Head of design</p><p>Packaging Rebrand</p>`,
      `<p>Farfetch | Assistant art director</p><p>Production and Creative Strategy</p>`,
      `<p>Farfetch | Senior Designer</p><p>Homepage and Editorials</p>`,
      `<p>So.Journer | Senior Designer </p><p>Lookbook and Editorial</p>`,
      `<p>Farfetch | Senior Designer</p><p>Beat Campaign Identity</p>`,
      `<p>Vestiaire Collective | Senior Designer</p><p>Offsite Digital Assets</p>`,
      `<p>Urban Night Project | Senior Designer</p><p>Visual Identity</p>`,
      `<p>Lyma | Graphic Designer</p><p>Print and Digital</p>`,
      `<p>Hi Noon | Graphic Designer</p><p>Visual Identity</p>`
      /* Add more captions if you want — otherwise column2 will be empty for remaining images */
    ];

    /* SHUFFLE images + captions ONCE at page load */
    function shufflePairArrays(imgArr, capArr) {
      for (let i = imgArr.length - 1; i > 0; i--) {
        const r = Math.floor(Math.random() * (i + 1));

        /* Swap images */
        [imgArr[i], imgArr[r]] = [imgArr[r], imgArr[i]];

        /* Swap captions if they exist */
        if (capArr[i] && capArr[r]) {
          [capArr[i], capArr[r]] = [capArr[r], capArr[i]];
        }
      }
    }

    shufflePairArrays(images, imageCaptions);

    /* MAIN LOGIC */
    let currentIndex = 0;
    const topBanner = document.getElementById("topBanner");
    const imageArea = document.getElementById("imageArea");
    const column2 = document.getElementById("column2");

    function updateColumn2(index) {
      column2.innerHTML = imageCaptions[index] || "";
    }

    function showImage(index) {
      imageArea.style.backgroundImage = `url('${images[index]}')`;
      updateColumn2(index);
    }

    /* Layout image area below banner */
    function layoutImageArea() {
      const bannerHeight = topBanner.offsetHeight;
      imageArea.style.top = bannerHeight + "px";
      imageArea.style.height = `calc(100vh - ${bannerHeight}px)`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      layoutImageArea();
      showImage(currentIndex);

      window.addEventListener("resize", layoutImageArea);

      /* CLICK: Advance through shuffled list */
      imageArea.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % images.length;
        showImage(currentIndex);
      });
    });
  </script>

</body>
</html>
