<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PRESAGE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 10pt;
      font-weight: 400;
      background: #ffffff;
      color: #000000;
      position: relative;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* ----------- IMAGE PREVIEW BEHIND TEXT (DESKTOP) ----------- */
    #image-preview {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }

    #image-preview img {
      width: 340px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Hide preview on mobile */
    @media (max-width: 700px) {
      #image-preview {
        display: block;
        opacity: 0.85;
        top: 55%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      #image-preview img {
        width: 260px;
        height: auto;
      }
    }

    /* ----------- DESKTOP LAYOUT (ABSOLUTE) ----------- */

    .top-left {
      position: absolute;
      top: 40px;
      left: 40px;
      line-height: 1.3;
      z-index: 2;
    }

    .top-left .name {
      font-weight: 500;
    }

    .center-block {
      position: absolute;
      top: 42%;
      left: 40px;
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 140px;
      align-items: end;
      line-height: 1.3;
      z-index: 2;
    }

    .small-label {
      margin-bottom: 10px;
    }

    .big-link {
      font-size: 52pt;
      font-weight: 500;
      text-decoration: underline;
      color: black;
      line-height: 1;
    }

    .bottom-left {
      position: absolute;
      bottom: 40px;
      left: 40px;
      max-width: 430px;
      line-height: 1.3;
      z-index: 2;
    }

    .bottom-right {
      position: absolute;
      bottom: 40px;
      left: 520px;
      line-height: 1.3;
      z-index: 2;
    }

    a {
      text-decoration: none;
      color: black;
    }
    a.big-link {
      text-decoration: underline;
    }

    /* ----------- MOBILE LAYOUT (STACKED + AUTO-FLICK) ----------- */
    @media (max-width: 700px) {
      .top-left,
      .center-block,
      .bottom-left,
      .bottom-right {
        position: relative;
        left: 0;
        z-index: 2;
      }

      body {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        padding-bottom: 40px;
      }

      .top-left {
        padding: 40px;
        margin-bottom: 40px;
      }

      .center-block {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        transform: translateY(-10%);
        padding-left: 40px;
        padding-right: 40px;
        margin-bottom: 40px;
      }

      .center-block div {
        margin-bottom: 20px;
      }

      .big-link {
        font-size: 36pt;
      }

      .bottom-left {
        padding-left: 40px;
        margin-top: 40px;
      }

      .bottom-right {
        padding-left: 40px;
        margin-top: 20px;
        padding-bottom: 40px;
      }
    }
  </style>
</head>

<body>

  <!-- IMAGE PREVIEW BEHIND TEXT -->
  <div id="image-preview">
    <img id="preview-img" src="1.jpg" alt="">
  </div>

  <!-- TOP LEFT -->
  <div class="top-left">
    <div class="name">Camille Yvert</div>
    <div>Lead Design + Art Direction</div>
  </div>

  <!-- CENTER TWO-COLUMN AREA -->
  <div class="center-block">
    <div>
      <div class="small-label">View/Download (7.3mb)</div>
      <a class="big-link" href="Camille Yvert Portfolio 2025.pdf" target="_blank">PORTFOLIO</a>
    </div>

    <div>
      <a class="big-link" href="Camille Yvert CV 2025.pdf" target="_blank">CV</a>
    </div>
  </div>

  <!-- BOTTOM LEFT -->
  <div class="bottom-left">
    Figma | Adobe Suite CC | Sketch | OpenAI | Visual Code Studio<br>
    Banner Flow | Smartly | Monday | Microsoft
  </div>

  <!-- BOTTOM RIGHT -->
  <div class="bottom-right">
    camille.yvert@gmail.com<br>
    +44 (0)7 542 843 769
  </div>

  <!-- FLICKING SCRIPT (DESKTOP SPEED-BASED + MOBILE AUTO-FLICK) -->
  <script>
    const totalImages = 20;
    const previewImg = document.getElementById("preview-img");

    // Preload images
    for (let i = 1; i <= totalImages; i++) {
      const img = new Image();
      img.src = i + ".jpg";
    }

    let currentIndex = 1;
    let lastX = null;

    /* ----------- DESKTOP FLICKING (MOUSE SPEED) ----------- */
   let targetIndex = 1;
let smoothingFrame = null;

const sensitivity = 0.20;
const maxStep = 1;
const smoothness = 0.15; // lower = smoother, slower; higher = snappier


    function desktopFlick(e) {
      if (window.innerWidth <= 700) return;

      if (lastX === null) {
        lastX = e.clientX;
        return;
      }

      const deltaX = e.clientX - lastX;
      lastX = e.clientX;

      let step = Math.floor(deltaX * sensitivity);
      if (step > maxStep) step = maxStep;
      if (step < -maxStep) step = -maxStep;

      currentIndex += step;
      if (currentIndex < 1) currentIndex = totalImages;
      if (currentIndex > totalImages) currentIndex = 1;

      previewImg.src = currentIndex + ".jpg";
    }

    window.addEventListener("mousemove", desktopFlick);

    /* ----------- MOBILE AUTO-FLICK (FIXED SPEED) ----------- */
    let mobileInterval = null;
    const mobileSpeed = 800;

    function startMobileAutoFlick() {
      if (window.innerWidth > 700) {
        if (mobileInterval !== null) {
          clearInterval(mobileInterval);
          mobileInterval = null;
        }
        return;
      }

      if (mobileInterval !== null) return;

      mobileInterval = setInterval(() => {
        currentIndex++;
        if (currentIndex > totalImages) currentIndex = 1;
        previewImg.src = currentIndex + ".jpg";
      }, mobileSpeed);
    }

    window.addEventListener("load", startMobileAutoFlick);
    window.addEventListener("resize", startMobileAutoFlick);
  </script>

</body>
</html>
