<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sanguine Agency Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 10pt;
      background-color: #ffffff;
      color: #000000;
      cursor: default;
    }

    /* FIXED TOP WHITE BANNER */
    .top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      z-index: 10;
      box-sizing: border-box;
    }

    .top-banner-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 1rem;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    /* TEXT COLUMNS */
    .text-column {
      max-width: 33vw;
      text-align: left;
      line-height: 0.8;
    }

    .text-column p {
      margin: 0 0 0.4rem 0;
    }

    .text-column a {
      text-decoration: underline;
      color: inherit;
    }

    .name-role {
      font-weight: 500;
    }

    /* FULL BLEED IMAGE */
    .image-area {
      position: fixed;
      left: 0;
      right: 0;
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      cursor: none;
      z-index: 0;
    }

    /* pure text mouse indicator */
    .mouse-indicator {
      position: fixed;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 8pt;
      color: #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 20;
      background: none;
      padding: 0;
      border-radius: 0;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .top-banner-inner {
        grid-template-columns: 1fr;
        row-gap: 1rem;
        padding: 1.25rem;
      }
      .text-column {
        max-width: 100%;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- TOP BANNER -->
  <div class="top-banner" id="topBanner">
    <div class="top-banner-inner">

      <!-- COLUMN 1 -->
      <div class="text-column">
        <p class="name-role">Camille Yvert | Design + Art Direction</p>
        <p>
          <a href="cv.pdf" target="_blank">CV</a> |
          <a href="portfolio.pdf" target="_blank">Portfolio</a> |
          <a href="mailto:camille.yvert@gmail.com">Contact</a>
        </p>
      </div>

      <!-- COLUMN 2 — NOW: Caption first, Counter second -->
      <div class="text-column">
        <p id="captionLine">Loading…</p>
        <p id="slideCounter">1 / 17</p>
      </div>

    </div>
  </div>

  <!-- FULL BLEED IMAGE -->
  <div class="image-area" id="imageArea"></div>

  <!-- TEXT-ONLY MOUSE INDICATOR -->
  <div class="mouse-indicator" id="mouseIndicator">next</div>

<script>
  /* IMAGES */
  let images = [
    "images/photo1.jpg","images/photo2.jpg","images/photo3.jpg","images/photo4.jpg",
    "images/photo5.jpg","images/photo6.jpg","images/photo7.jpg","images/photo8.jpg",
    "images/photo9.jpg","images/photo10.jpg","images/photo11.jpg","images/photo12.jpg",
    "images/photo13.jpg","images/photo14.jpg","images/photo15.jpg"
  ];

  /* ONE-LINE CAPTIONS */
  let captions = [
    "Beauty Seen Group / Client: Dove | Lead Designer",
    "The Nue Co | Head of Design",
    "The Nue Co | Head of Design",
    "The Nue Co | Head of Design",
    "Trends & Culture Agency / Client: Ecco | Lead Designer",
    "The Nue Co | Head of Design",
   "Trends & Culture Agency / CLient: Ecco | Lead Designer",
   "Farfect | Senior Designer",
    "Farfect | Assistant Art Director",
    "Vestiaire Collective | Senior Designer",
    "Urban Night Project | Senior Designer",
  "Farfect | Senior Designer, Picture Editor",
     "Farfect | Senior Designer, Picture Editor",
     "Lyma | Graphic Designer",
     "Farfect | Senior Designer"
  ];

  /* SHUFFLE IMAGES + CAPTIONS ONCE */
  function shufflePairs(a, b) {
    for (let i = a.length - 1; i > 0; i--) {
      const r = Math.floor(Math.random() * (i + 1));
      [a[i], a[r]] = [a[r], a[i]];
      [b[i], b[r]] = [b[r], b[i]];
    }
  }
  shufflePairs(images, captions);

  let currentIndex = 0;

  const topBanner = document.getElementById("topBanner");
  const imageArea = document.getElementById("imageArea");
  const slideCounter = document.getElementById("slideCounter");
  const captionLine = document.getElementById("captionLine");
  const mouseIndicator = document.getElementById("mouseIndicator");

  function showImage(i) {
    imageArea.style.backgroundImage = `url('${images[i]}')`;
    slideCounter.textContent = `${i + 1} / ${images.length}`;
    captionLine.textContent = captions[i] || "";
  }

  function layoutImageArea() {
    const h = topBanner.offsetHeight;
    imageArea.style.top = h + "px";
    imageArea.style.height = `calc(100vh - ${h}px)`;
  }

  /* MOUSE MOVE → TEXT FOLLOW + BACK/NEXT LABEL */
  imageArea.addEventListener("mousemove", (e) => {
    const mid = window.innerWidth / 2;
    mouseIndicator.textContent = e.clientX < mid ? "back" : "next";
    mouseIndicator.style.left = (e.clientX + 10) + "px";
    mouseIndicator.style.top = (e.clientY + 20) + "px";
    mouseIndicator.style.opacity = 1;
  });

  imageArea.addEventListener("mouseleave", () => {
    mouseIndicator.style.opacity = 0;
  });

  /* CLICK → BACK or NEXT */
  imageArea.addEventListener("click", (e) => {
    const mid = window.innerWidth / 2;

    if (e.clientX < mid) {
      currentIndex = (currentIndex - 1 + images.length) % images.length; // BACK
    } else {
      currentIndex = (currentIndex + 1) % images.length; // NEXT
    }

    showImage(currentIndex);
  });

  document.addEventListener("DOMContentLoaded", () => {
    layoutImageArea();
    showImage(currentIndex);
    window.addEventListener("resize", layoutImageArea);
  });
</script>

</body>
</html>
